name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build (dist must match src)
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "dist/ is out of date — run npm run build and commit" && exit 1)
      - name: Size budget
        run: npm run size

      - name: Unit tests (no browser)
        run: npm test
      - name: Browser tests
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google.list
          npx playwright install --with-deps chromium
          npm run test:browser
